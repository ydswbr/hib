name: Ubuntu Xtream VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 360

    steps:
      - name: 1. Install Necessary Dependencies
        run: |
          sudo apt-get update
          # تثبيت الأدوات الأساسية التي تحتاجها لوحة اكستريم
          sudo apt-get install -y libxslt1-dev libcurl4-openssl-dev libmariadb-client-lgpl-dev libgeoip-dev python-is-python3 wget curl
          
      - name: 2. Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: 3. Connect to Tailscale
        run: |
          # استخدم مفتاح التوثيق الخاص بك هنا
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=xtream-server

      - name: 4. Setup Root Password
        run: |
          # تعيين كلمة مرور للـ Root لتسهيل عملية التثبيت
          echo "root:Xtream2026" | sudo chpasswd
          # تفعيل دخول الجذور عبر SSH إذا كنت ستحتاجه
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: 5. Server Info
        run: |
          echo "=========================================="
          echo "SERVER IS READY FOR XTREAM INSTALLATION"
          echo "IP Address: $(tailscale ip -4)"
          echo "User: root"
          echo "Password: Xtream2026"
          echo "=========================================="

      - name: 6. Keep Alive
        run: sleep 6h
